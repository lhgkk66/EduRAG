[project]
name = "edurag"
version = "0.1.0"
description = "教育领域 RAG 问答系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pymilvus>=2.4.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "jieba>=0.42.1",
    "FlagEmbedding>=1.2.0",
    "transformers>=4.40.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
