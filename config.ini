# MySQL 配置
[mysql]
host = localhost
port = 3307
user = root
password = 123456
database = subjects_kg
# Redis 配置
[redis]
host = localhost
port = 6379
password = 1234
db = 0
# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_v2

# LLM 配置
[llm]
model = qwen3.7-plus
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# FQA 参数
[fqa]
relative_threshold = 0.85
absolute_threshold = 10.0

# 检索参数
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 10
candidate_m = 2

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678

# 日志配置
[logger]
log_dir = logs
log_level = INFO
log_max_bytes = 10485760
log_backup_count = 5